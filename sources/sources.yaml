# 数据源注册表（批量注册版 · 逐批开启）
#
# batch 标记所属接入批次：
#   1 = 学会（结构规范、易解析）
#   2 = 科研机构 / 会议聚合站
#   3 = 高校（C9 + 浙江省/杭州）
#   4 = 公共流媒体（公众号/小红书/抖音，半自动）
#
# enabled: true  = 已接入可抓取
# enabled: false = 待逐批勘察后开启（需填 list_url/selectors）
# 标注 # 需核验 的域名/栏目在开启该批次时逐站确认。

version: 2

defaults:
  rate_limit_ms: 1500
  timeout_s: 20
  user_agent: "EventAggregatorBot/1.0 (+https://github.com/Logicar/Event-Aggregator)"
  max_retries: 3
  backoff_s: 5


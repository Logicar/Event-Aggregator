      base_url: "https://www.cpa.org.cn"
      list_url: "https://www.cpa.org.cn/?do=infolist&classid=270"
      category: 学会
      domains: [医学药学]
      fields: [药学, 临床药学, 药物制剂]
      adapter: cpa
      organizer_type: society
      batch: 1
      enabled: true

    - name: 中国人工智能学会
